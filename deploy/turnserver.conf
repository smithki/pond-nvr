# coturn, for Pond: a relay of your own, kept to itself.
#
# Pond signs in with a time-limited name and password made from this secret (TURN's REST scheme): set the same
# secret in Pond (Settings › Remote Access › Relay). Change it from this placeholder before starting.
use-auth-secret
static-auth-secret=CHANGE-ME-TO-A-LONG-RANDOM-SECRET
realm=pond

# 3478 is the signaling service's STUN; the relay listens beside it.
listening-port=3480
min-port=49160
max-port=49200
fingerprint

# Only for relaying to the internet: never to this server's own networks, or anyone's private ones.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
