# Pond's appcast, the feed Sparkle offers updates of the app from (site/public/appcast.xml, served at
# pond.camera/appcast.xml): when a release is published on GitHub (its draft published by hand, after a look), its
# entry is made from the release's own Pond-VERSION.sparkle (Sparkle's signature of its disk image, made by make
# release) and the changelog, and pond-nvr-bot proposes it in a pull request. Merging it deploys pond.camera, and Pond
# copies are offered the update from then. Needs no signing key: the signature was made with the release.
# (docs/release.md, Updates; docs/ci-security.md, pond-nvr-bot.)
name: Appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  appcast:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    environment: appcast
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Its entry
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          if ! gh release download "$TAG" --pattern "Pond-$version.sparkle" --dir "$RUNNER_TEMP"; then
            echo "Pond $version's release has no Sparkle signature (made before updates were): not in the appcast." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/appcast.py "$version" "$RUNNER_TEMP/Pond-$version.sparkle"
          git diff --quiet site/public/appcast.xml || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: A token for this repository
        if: steps.entry.outputs.changed == 'true'
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: A pull request
        if: steps.entry.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          version=${TAG#v}
          id=$(gh api "/users/$BOT" --jq .id)
          git config user.name "$BOT"
          git config user.email "$id+$BOT@users.noreply.github.com"
          branch="appcast/$TAG"
          git checkout -b "$branch"
          git add site/public/appcast.xml
          git commit -m "Appcast: Pond $version"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          gh pr create --base main --head "$branch" --title "Appcast: Pond $version" --body "$(cat <<EOF
          Pond $version in the appcast, from its published release's Sparkle signature (\`Pond-$version.sparkle\`) and the changelog.

          Merging deploys pond.camera's appcast: Pond copies with updates are offered $version from then.
          EOF
          )" || echo "(The pull request is there already: updated.)"
