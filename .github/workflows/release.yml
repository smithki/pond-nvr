# A release, made from a tag: pushing v0.1.0 runs make release VERSION=0.1.0 (scripts/release.sh) on macOS, signed
# with the Developer ID and notarized with the App Store Connect API key from the release environment's secrets
# (scripts/ci-secrets.sh puts them there; docs/release.md, Releases from CI), and makes a draft GitHub release with
# the disk image, its checksum and the changelog's section as its notes. Published by hand, after a look.
#
# The runner: GitHub's macOS 27 one, with Xcode 27 (the variable RELEASE_RUNNER names another: a machine of yours
# must run nothing else).
name: Release

on:
  push:
    tags: ["v*"]

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # the draft release

jobs:
  release:
    runs-on: ${{ vars.RELEASE_RUNNER || 'macos-27' }}
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Search's picture model, converted once and kept between releases (a few GB to convert, about 390 MB made),
      # until a published one with a pinned hash replaces it (docs/search.md).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models/search
          key: search-model-${{ hashFiles('scripts/search-model.sh', 'scripts/convert-siglip.py') }}

      - name: The release keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/ci-keychain.sh setup

      - name: make release
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      - name: A draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The changelog's section for this version: from its heading to the next.
          awk -v v="$version" '$0 ~ "^## " { if (on) exit; on = ($2 == v); next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Pond $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/release/Pond-$version.dmg" "dist/release/Pond-$version.dmg.sha256"

      - name: Remove the release keychain
        if: always()
        run: scripts/ci-keychain.sh remove
